name: Build RootWise
on:
  push:
    branches: [main, feature/global-agriculture-mvp, "fix/**", "feature/**"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No npm cache is configured until a package-lock.json is committed.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
